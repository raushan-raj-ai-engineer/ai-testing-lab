[pytest]

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    agent_quality: fast deterministic agent quality-gate tests
    agent_live: real Ollama + Playwright MCP agent quality tests
    multi_agent: fast deterministic multi-agent tests
    multi_agent_live: real Ollama + Playwright MCP multi-agent tests
    guardrail: deterministic agent guardrail and adversarial tests
    guardrail_live: real Ollama + Playwright MCP safety integration tests
    observability: deterministic agent tracing and performance tests
    observability_live: real Ollama + Playwright MCP observability tests
    reliability: repeated-run reliability and flakiness tests
    reliability_live: real repeated Ollama + Playwright MCP reliability tests
    eval_pipeline: production evaluation pipeline and dashboard tests
    agentic_rag: Agentic RAG routing retrieval grounding and citation tests
    ai_api: AI API contract and performance tests
    final_project: final end-to-end AI SDET release gate tests
    interview_prep: senior AI automation interview preparation tests
