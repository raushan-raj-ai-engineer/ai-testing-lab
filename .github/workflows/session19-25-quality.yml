name: Sessions 19-25 AI Quality

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  fast-quality:
    name: Sessions 19-25 Deterministic Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Show Python environment
        run: |
          python --version
          python -m pip --version
          python -m pytest --version

          python -c "from mcp.types import TextContent; print('MCP import OK')"

      - name: Run Sessions 19-25 deterministic tests
        run: |
          python -m pytest \
            tests/observability \
            tests/reliability \
            tests/eval_pipeline \
            tests/agentic_rag \
            tests/ai_api_testing \
            tests/final_project \
            tests/interview_prep \
            -m "not observability_live and not reliability_live" \
            -v