name: Agent Safety Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  deterministic-safety:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run guardrail tests
        run: |
          pytest tests/guardrails \
            -m "guardrail and not guardrail_live" \
            -v

      - name: Run adversarial release gate
        run: |
          PYTHONPATH=. \
          python scripts/run_session18_guardrail_gate.py


  live-safety:

    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          npx -y playwright@latest \
            install --with-deps chromium

      - name: Install Ollama
        run: |
          curl -fsSL \
            https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve \
            > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.2

      - name: Start Playwright MCP
        run: |
          npx -y @playwright/mcp@latest \
            --port 8931 \
            --headless \
            --isolated \
            > /tmp/mcp.log 2>&1 &
          sleep 8

      - name: Run live safety gate
        run: |
          PYTHONPATH=. \
          python \
            scripts/run_session18_guardrail_gate.py \
            --live