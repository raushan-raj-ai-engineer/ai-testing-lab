name: Agent Safety Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # DETERMINISTIC SAFETY GATE
  #
  # Runs automatically on push / pull request.
  #
  # Does NOT start:
  # - Ollama server
  # - Chromium
  # - Playwright MCP
  #
  # These tests should remain fast and deterministic.
  # =========================================================

  deterministic-safety:

    name: Deterministic Agent Safety

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      PYTHONPATH: .

      # Keep one consistent MCP URL across local and CI.
      PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # PYTHON
      # -----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # -----------------------------------------------------
      # INSTALL DEPENDENCIES
      #
      # requirements.txt is the source of truth.
      #
      # Expected important packages:
      #
      # pytest>=8,<10
      # mcp>=1.28,<2
      # ollama>=0.4,<1
      # anyio>=4,<5
      # deepeval>=4,<5
      # -----------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt


      # -----------------------------------------------------
      # VERIFY ENVIRONMENT
      #
      # This catches dependency problems BEFORE pytest
      # collection.
      # -----------------------------------------------------

      - name: Verify Python environment
        run: |
          echo "======================================"
          echo "PYTHON ENVIRONMENT"
          echo "======================================"

          python --version

          python -m pip --version

          python -m pytest --version

          echo
          echo "======================================"
          echo "AI TESTING DEPENDENCIES"
          echo "======================================"

          python -c "
          import anyio
          import deepeval

          from ollama import chat

          from mcp import ClientSession
          from mcp.types import TextContent
          from mcp.client.streamable_http import streamable_http_client

          print('AnyIO import             : OK')
          print('DeepEval import          : OK')
          print('Ollama Python SDK        : OK')
          print('MCP ClientSession        : OK')
          print('MCP TextContent          : OK')
          print('MCP Streamable HTTP      : OK')
          "


      # -----------------------------------------------------
      # DETERMINISTIC GUARDRAIL TESTS
      #
      # DeepEval pytest plugin is disabled because this
      # particular suite does not require semantic evaluation.
      #
      # DeepEval remains installed for other AI test suites.
      # -----------------------------------------------------

      - name: Run deterministic guardrail tests
        run: |
          python -m pytest \
            -p no:deepeval \
            tests/guardrails \
            -m "guardrail and not guardrail_live" \
            -v


      # -----------------------------------------------------
      # ADVERSARIAL DATASET / RELEASE GATE
      # -----------------------------------------------------

      - name: Run adversarial safety release gate
        run: |
          python \
            scripts/run_session18_guardrail_gate.py


  # =========================================================
  # LIVE SAFETY GATE
  #
  # Runs ONLY manually:
  #
  # GitHub
  # → Actions
  # → Agent Safety Gate
  # → Run workflow
  #
  # Uses:
  # - Ollama
  # - llama3.2
  # - Chromium
  # - Playwright MCP
  # - real MCP ClientSession
  # =========================================================

  live-safety:

    name: Live Agent Safety

    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      PYTHONPATH: .

      # IMPORTANT:
      # localhost prevents the MCP host validation issue
      # we saw with 127.0.0.1.
      PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp

      RUN_GUARDRAIL_LIVE: "1"


    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # PYTHON
      # -----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # -----------------------------------------------------
      # NODE
      # -----------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: "22"


      # -----------------------------------------------------
      # PYTHON DEPENDENCIES
      # -----------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt


      # -----------------------------------------------------
      # VERIFY PYTHON DEPENDENCIES
      # -----------------------------------------------------

      - name: Verify Python and MCP environment
        run: |
          echo "======================================"
          echo "PYTHON / MCP ENVIRONMENT"
          echo "======================================"

          python --version

          python -m pip --version

          python -m pytest --version

          python -c "
          import anyio

          from ollama import chat

          from mcp import ClientSession
          from mcp.types import TextContent
          from mcp.client.streamable_http import streamable_http_client

          print('AnyIO                   : OK')
          print('Ollama Python SDK       : OK')
          print('MCP ClientSession       : OK')
          print('MCP TextContent         : OK')
          print('MCP Streamable HTTP     : OK')
          "


      # -----------------------------------------------------
      # INSTALL CHROMIUM
      # -----------------------------------------------------

      - name: Install Chromium
        run: |
          npx -y playwright@latest \
            install \
            --with-deps \
            chromium


      # -----------------------------------------------------
      # INSTALL OLLAMA
      # -----------------------------------------------------

      - name: Install Ollama
        run: |
          curl -fsSL \
            https://ollama.com/install.sh \
            | sh


      # -----------------------------------------------------
      # START OLLAMA
      # -----------------------------------------------------

      - name: Start Ollama
        run: |
          echo "Starting Ollama..."

          ollama serve \
            > /tmp/ollama.log \
            2>&1 &

          echo $! > /tmp/ollama.pid

          sleep 5


      # -----------------------------------------------------
      # VERIFY OLLAMA PROCESS
      # -----------------------------------------------------

      - name: Verify Ollama
        run: |
          echo "======================================"
          echo "OLLAMA"
          echo "======================================"

          ollama --version

          ollama list

          if [ -f /tmp/ollama.pid ]; then

            OLLAMA_PID=$(cat /tmp/ollama.pid)

            echo
            echo "Ollama PID: ${OLLAMA_PID}"

            if kill -0 "${OLLAMA_PID}" 2>/dev/null; then

              echo "Ollama process is running"

            else

              echo "Ollama process is NOT running"

              cat /tmp/ollama.log || true

              exit 1

            fi

          else

            echo "Ollama PID file missing"

            exit 1

          fi


      # -----------------------------------------------------
      # PULL MODEL
      # -----------------------------------------------------

      - name: Pull llama3.2
        run: |
          ollama pull llama3.2

          echo
          echo "======================================"
          echo "AVAILABLE OLLAMA MODELS"
          echo "======================================"

          ollama list


      # -----------------------------------------------------
      # START PLAYWRIGHT MCP
      #
      # IMPORTANT:
      #
      # --host localhost
      # --allowed-hosts localhost
      #
      # prevents the previous:
      #
      # 403 Forbidden
      #
      # problem.
      # -----------------------------------------------------

      - name: Start Playwright MCP
        run: |
          echo "Starting Playwright MCP..."

          npx -y @playwright/mcp@latest \
            --host localhost \
            --port 8931 \
            --allowed-hosts localhost \
            --headless \
            --isolated \
            > /tmp/playwright-mcp.log \
            2>&1 &

          echo $! > /tmp/playwright-mcp.pid

          sleep 8


      # -----------------------------------------------------
      # VERIFY MCP PROCESS
      # -----------------------------------------------------

      - name: Verify Playwright MCP process
        run: |
          echo "======================================"
          echo "PLAYWRIGHT MCP"
          echo "======================================"

          echo
          echo "MCP URL:"
          echo "${PLAYWRIGHT_MCP_URL}"

          echo
          echo "MCP startup log:"
          echo

          cat /tmp/playwright-mcp.log || true

          echo

          if [ -f /tmp/playwright-mcp.pid ]; then

            MCP_PID=$(cat /tmp/playwright-mcp.pid)

            echo "MCP PID: ${MCP_PID}"

            if kill -0 "${MCP_PID}" 2>/dev/null; then

              echo "Playwright MCP process is running"

            else

              echo "Playwright MCP process is NOT running"

              exit 1

            fi

          else

            echo "MCP PID file missing"

            exit 1

          fi


      # -----------------------------------------------------
      # LIVE MCP GUARDRAIL TESTS
      #
      # Disable all third-party pytest plugins so DeepEval
      # does not slow/hang this MCP test suite.
      #
      # Then explicitly enable AnyIO only.
      # -----------------------------------------------------

      - name: Run live Playwright MCP guardrail tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

          RUN_GUARDRAIL_LIVE: "1"

          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp

        run: |
          python -m pytest \
            -p anyio.pytest_plugin \
            tests/guardrails/test_guardrail_live.py \
            -v \
            -s


      # -----------------------------------------------------
      # LIVE AI SAFETY RELEASE GATE
      # -----------------------------------------------------

      - name: Run live AI safety release gate
        env:
          RUN_GUARDRAIL_LIVE: "1"

          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp

        run: |
          python \
            scripts/run_session18_guardrail_gate.py \
            --live


      # -----------------------------------------------------
      # UPLOAD OLLAMA LOG
      #
      # Always upload so evidence remains available even
      # when tests fail.
      # -----------------------------------------------------

      - name: Upload Ollama logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: agent-safety-ollama-logs

          path: /tmp/ollama.log

          if-no-files-found: warn

          retention-days: 7


      # -----------------------------------------------------
      # UPLOAD MCP LOG
      # -----------------------------------------------------

      - name: Upload Playwright MCP logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: agent-safety-playwright-mcp-logs

          path: /tmp/playwright-mcp.log

          if-no-files-found: warn

          retention-days: 7


      # -----------------------------------------------------
      # FAILURE DEBUGGING
      # -----------------------------------------------------

      - name: Print Ollama logs on failure
        if: failure()

        run: |
          echo
          echo "======================================"
          echo "OLLAMA FAILURE LOG"
          echo "======================================"
          echo

          cat /tmp/ollama.log || true


      - name: Print Playwright MCP logs on failure
        if: failure()

        run: |
          echo
          echo "======================================"
          echo "PLAYWRIGHT MCP FAILURE LOG"
          echo "======================================"
          echo

          cat /tmp/playwright-mcp.log || true